name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --omit=optional
      - run: python3 -m venv .tools/python && .tools/python/bin/python -m pip install -r requirements-unity.txt
      - run: npm run check
      - run: npm run demo
      - run: node scripts/package-smoke.mjs
